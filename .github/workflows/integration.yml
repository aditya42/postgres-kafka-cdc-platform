name: Integration Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: make up
      - run: python -m scripts.seed_changes
      - run: python -m scripts.wait_for_raw --timeout 120
      - run: python -m pytest -m integration tests/integration
      - run: make spark
      - run: python -m scripts.reconcile
      - if: always()
        run: docker compose logs --no-color > integration-docker.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-docker-logs
          path: integration-docker.log
